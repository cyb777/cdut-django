<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>登录</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .login-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-face {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #43e97b, #38f9d7);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-register:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>
    <div id="myapp">
        <div class="login-box">
            <h2>用户登录</h2>
            <div class="form-group">
                <input type="text" placeholder="账号" v-model="username">
            </div>
            <div class="form-group">
                <input type="password" placeholder="密码" v-model="password">
            </div>
            <button class="btn-login" @click="login">登录</button>
            <button class="btn-face" @click="faceLogin">人脸识别登录</button>
            <button class="btn-register" @click="register">注册</button>
        </div>
    </div>
<script>
    new Vue({
        el: "#myapp",
        data: {
            username: "",
            password: ""
        },
        methods: {
            login() {
                console.log("账号", this.username);
                console.log("密码", this.password);
                fetch("/login_message_collect/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        action: "login",
                        username: this.username,
                        password: this.password
                    })
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.msg);
                    if (data.status === 200) {
                        window.location.href = "/main_page/";
                    }
                });
            },
            faceLogin() {
                console.log("跳转到人脸识别");
                window.location.href = "/match_page/";
            },
            register() {
                console.log("跳转到注册页面");
                window.location.href = "/register_page/";
            }
        }
    });
</script>
</body>
</html>
