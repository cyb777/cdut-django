<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>注册</title>
    <script src="https://cdn.jsdelivr.net/npm/vue@2/dist/vue.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .register-box {
            background: rgba(255, 255, 255, 0.95);
            padding: 40px 50px;
            border-radius: 16px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.2);
        }
        h2 {
            text-align: center;
            color: #333;
            margin-bottom: 30px;
            font-size: 24px;
        }
        .form-group {
            margin-bottom: 20px;
        }
        .form-group input {
            width: 100%;
            padding: 12px 16px;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .form-group input:focus {
            border-color: #667eea;
        }
        .btn-register {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #f093fb, #f5576c);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
        .btn-register:hover {
            opacity: 0.9;
        }
        .btn-login {
            width: 100%;
            padding: 12px;
            margin-top: 15px;
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <div id="myapp">
        <div class="register-box">
            <h2>用户注册</h2>
            <div class="form-group">
                <input type="text" placeholder="账号" v-model="username">
            </div>
            <div class="form-group">
                <input type="password" placeholder="密码" v-model="password">
            </div>
            <div class="form-group">
                <input type="password" placeholder="确认密码" v-model="confirmPassword">
            </div>
            <button class="btn-register" @click="register">注册</button>
            <button class="btn-login" @click="goLogin">返回登录</button>
        </div>
    </div>
<script>
    new Vue({
        el: "#myapp",
        data: {
            username: "",
            password: "",
            confirmPassword: ""
        },
        methods: {
            register() {
                if (this.password !== this.confirmPassword) {
                    alert("两次密码输入不一致");
                    return;
                }
                console.log("注册账号", this.username);
                console.log("注册密码", this.password);
                fetch("/login_message_collect/", {
                    method: "POST",
                    headers: {"Content-Type": "application/json"},
                    body: JSON.stringify({
                        action: "register",
                        username: this.username,
                        password: this.password
                    })
                })
                .then(response => response.json())
                .then(data => {
                    alert(data.msg);
                    if (data.status === 200) {
                        window.location.href = "/face_page/";
                    }
                });
            },
            goLogin() {
                window.location.href = "/login/";
            }
        }
    });
</script>
</body>
</html>
